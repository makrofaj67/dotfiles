# Picom config for Qtile (X11)
backend = "glx";
vsync = true;

# Keep window opacity fully opaque by default.
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;

# Rounded corners.
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# Soft shadows.
shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.30;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Light fade for open/close transitions.
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Avoid drawing rounded corners/shadows in screenshot tools and bars.
wintypes:
{
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
};
