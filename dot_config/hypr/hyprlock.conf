# ==============================================================================
# HYPRLOCK CONFIGURATION - Minimal Unified Theme
# ==============================================================================

general {
    ignore_empty_input = true
    hide_cursor = true
    grace = 0
}

# Arka Plan: Açık pencerelerin buzlu cam (frosted glass) efekti
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    contrast = 0.85
    brightness = 0.65
    vibrancy = 0.2
    vibrancy_darkness = 0.05
}

# 1. SAAT (Minimal, Büyük ve Net)
label {
    monitor =
    text = $TIME
    color = rgb(241, 230, 216)
    font_size = 72
    font_family = Hack, JetBrains Mono Nerd Font
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# 2. TARİH
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = rgb(255, 154, 47)
    font_size = 13
    font_family = Hack, JetBrains Mono Nerd Font
    position = 0, 35
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.5)
}

# 3. ŞİFRE GİRİŞ ALANI (Minimal Kapsül)
input-field {
    monitor =
    size = 240, 40
    outline_thickness = 1
    
    # İç Zemin (Koyu Base)
    inner_color = rgba(13, 11, 9, 0.85)

    # Kenarlık (Theme.border Turuncu)
    outer_color = rgb(255, 154, 47)
    
    # Doğrulama / İşlem Rengi
    check_color = rgb(255, 154, 47)
    
    # Hata Rengi (Theme.error Kırmızı)
    fail_color = rgb(213, 17, 16)

    # Şifre Noktaları & Font
    font_color = rgb(241, 230, 216)
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    
    fade_on_empty = false
    placeholder_text = <span foreground="##8d887f">Şifre...</span>
    fail_text = <span foreground="##d51110"><i>Hatalı Şifre ($ATTEMPTS)</i></span>
    
    rounding = 6
    
    position = 0, -50
    halign = center
    valign = center
}

# 4. KULLANICI ETİKETİ (Minimal Alt Bilgi)
label {
    monitor =
    text = 󰌾 $USER
    color = rgb(141, 136, 127)
    font_size = 11
    font_family = Hack, JetBrains Mono Nerd Font
    position = 0, 25
    halign = center
    valign = bottom
}
